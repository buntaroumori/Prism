# Example plugin: Volume Guard
#
# Copy this directory into the Prism plugin folder (Settings -> Plugins ->
# Folder) and press "Rescan". The manifest is validated on load; a single
# invalid field rejects the whole plugin with a message in the panel.

[plugin]
id = "io.prism.volume-guard"
name = "Volume Guard"
version = "1.0.0"
api = 1
entry = "main.lua"
description = "Sets a fixed listening level whenever a new track starts, so a loud master cannot surprise you."
author = "Prism Contributors"
homepage = "https://github.com/prism-audio/prism"
# Everything this plugin is allowed to do. Remove one and the matching host
# call fails at runtime with an error naming the missing capability.
capabilities = ["log", "notify", "player:control", "player:read"]

[[settings]]
key = "target_db"
label = "Target level"
type = "number"
default = -12.0
min = -40.0
max = 0.0
help = "Engine volume applied on every track change, in dB from -40 to 0."

[[settings]]
key = "announce"
label = "Announce changes"
type = "boolean"
default = false
help = "Show a notification each time the level is applied."
