name: CI

# Pull-request and branch validation. The release workflow re-runs the quality
# gate before publishing; this file gives fast feedback on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "20.19.0"
  PNPM_VERSION: "10.34.7"
  RUST_VERSION: "1.88.0"

jobs:
  frontend:
    name: Frontend contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs
      - run: pnpm check
      - run: pnpm build

  database:
    name: SQLite schema & FTS5
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_schema.py

  rust:
    name: Rust (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libasound2-dev libpipewire-0.3-dev libxdo-dev \
            libayatana-appindicator3-dev libclang-dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.label }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Formatting
        if: matrix.label == 'linux'
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      - name: Tests
        run: cargo test --all-targets
