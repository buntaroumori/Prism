name: Miri

# Deep undefined-behaviour checking, off the pull-request path.
#
# Miri interprets the crate instead of executing it, which means it also
# interprets every dependency — WebKitGTK bindings, tokio, rustls — and a single
# PR run does not fit inside a sane timeout. It is still worth running: it finds
# UB that valgrind cannot see, in the modules that own memory without `unsafe`.
# So it runs weekly and on demand, over the pure-logic modules only.
#
#   gh workflow run miri.yml

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NODE_VERSION: "20.19.0"
  PNPM_VERSION: "10.34.7"

jobs:
  miri:
    name: Miri (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "audio::ring"
          - target: "audio::format"
          - target: "lyrics::"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libasound2-dev libpipewire-0.3-dev libxdo-dev \
            libayatana-appindicator3-dev libclang-dev

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.target }}
          cache-targets: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Interpret ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri setup
          cargo miri test --lib "${{ matrix.target }}"
